
databases:
  - name: payguard-db
    plan: free
    databaseName: payguard
    user: payguard

services:
  - type: web
    name: payguard-api
    runtime: docker
    rootDir: backend/payguard
    healthCheckPath: /ready
    envVars:
      - {key: APP_ENV, value: production}
      - {key: TRUST_PROXY, value: "true"}
      - {key: DATABASE_URL, fromDatabase: {name: payguard-db, property: connectionString}}
      - {key: JWT_SECRET, generateValue: true}
      - {key: ADMIN_KEY, generateValue: true}
      - {key: PUBLIC_URL, sync: false}
      - {key: CORS_ORIGINS, sync: false}
      - {key: PAYPAL_CLIENT_ID, sync: false}
      - {key: PAYPAL_CLIENT_SECRET, sync: false}
      - {key: PAYPAL_WEBHOOK_ID, sync: false}
      - {key: ANTHROPIC_API_KEY, sync: false}
